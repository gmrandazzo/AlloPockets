[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allopockets"
version = "1.0.8"
description = "Machine learning allosteric pocket prediction, pathway tracing, and 3D visualization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0" }
authors = [
    { name = "Francho Nerín Fonz", email = "fnerin@bioacademy.gr" },
    { name = "Giuseppe Marco Randazzo", email = "gmrandazzo@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "peewee>=3.17.0",
    "biopython>=1.80",
    "networkx>=3.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "click>=8.0.0",
    "joblib>=1.3.0",
    "pdbecif>=1.5",
    "biotite>=1.0",
    "pyarrow>=14.0.0",
    "lightgbm>=4.0.0",
    "openmm>=8.0.0",
    "pdbfixer>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "bandit[toml]>=1.7.0",
]
gbm = ["xgboost>=2.0.0"]
full = [
    "prody>=2.4.0",
    "colabfold",
    "alphafold-colabfold",
    "ipymolstar>=0.0.5",
]

[project.scripts]
allopockets = "allopockets.cli:main"
allopockets-predict = "allopockets.cli:predict_cli"
allopockets-prepare-data = "allopockets.cli:prepare_data_cli"
allopockets-train = "allopockets.cli:train_cli"
allopockets-inspect-3d = "allopockets.cli:inspect_3d_cli"
allopockets-install-deps = "allopockets.cli:install_deps_cli"

[tool.setuptools.packages.find]
include = ["allopockets*"]

[tool.setuptools.package-data]
"*" = ["*.json", "py.typed"]

[tool.black]
line-length = 100
target-version = ['py313']
exclude = '''
/(
    \.git
  | \.venv
  | notebooks
  | data
  | build
  | dist
)/
'''

[tool.bandit]
exclude_dirs = [".venv", "tests", "notebooks", "data"]
skips = ["B101", "B404", "B603", "B607", "B110", "B112", "B301", "B403", "B615", "B202"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "allopockets.database.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
